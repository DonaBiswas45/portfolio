}
:root[data-theme="dark"] {

  --ink: #ffeaf2; --muted: #e3b0c6; --line: #6a2f4d; --accent: #ff7aa8; --accent-2: #ffb3cd; --accent-ink: #3a0a20;

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body {

  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.65; font-weight: 400;

}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

main, footer { position: relative; z-index: 1; }
a { color: var(--accent); text-underline-offset: 3px; }

.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; margin: 0; text-wrap: balance; font-weight: 600; }
p { margin: 0; }

/* nav */
header.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--nav-bg); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); }

.brand { font-family: var(--font-display); font-style: italic; font-weight: 600; font-size: 24px; color: var(--accent); text-decoration: none; margin-right: auto; }
.nav nav { display: flex; gap: 2px; flex-wrap: wrap; }
.nav nav a { color: var(--muted); text-decoration: none; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; font-weight: 500; }

.theme { font: 500 12px var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; background: transparent; color: var(--accent); border: 1px solid var(--accent-2); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.theme:hover { background: var(--accent-soft); }
.nav nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

@media (max-width: 700px) {

  .nav nav a { padding: 6px 10px; font-size: 12px; letter-spacing: 0.1em; }
}

/* hero */

.eyebrow { font-size: 13px; color: var(--gold); letter-spacing: 0.3em; text-transform: uppercase; font-weight: 500; }
.hero h1 {

  animation: shimmer 9s linear infinite;
}
@keyframes shimmer { from { background-position: 0% 0; } to { background-position: 220% 0; } }
.hero .lead { font-size: 20px; color: var(--muted); max-width: 32em; font-weight: 300; }
.cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 30px; }

.btn.primary { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: var(--accent-ink); border-color: transparent; box-shadow: var(--shadow); }

.card-svc { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); font-family: var(--font-mono); font-size: 13.5px; overflow: hidden; min-width: 0; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.card-svc .bar { display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); color: var(--muted); flex-wrap: wrap; background: var(--accent-soft); }
.card-svc .bar b { color: var(--accent); font-weight: 500; }
.card-svc .status { color: var(--signal); }
.card-svc pre { margin: 0; padding: 18px; overflow-x: auto; line-height: 1.8; }
.card-svc .k { color: var(--muted); } .card-svc .v { color: var(--ink); }
@media (max-width: 800px) { .hero { grid-template-columns: minmax(0, 1fr); gap: 34px; padding-block: 44px; } }

/* sections */
section { padding-block: 64px; position: relative; }
section::before { content: "\2726  \2727  \2726"; display: block; text-align: center; color: var(--accent-2); letter-spacing: 0.9em; font-size: 12px; margin-bottom: 30px; padding-left: 0.9em; }
.sec-head { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 36px; text-align: center; }

.about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 40px; }

.facts { display: grid; gap: 4px; align-content: start; font-size: 15px; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 14px 22px; box-shadow: var(--shadow); margin: 0; }

footer { padding-block: 32px 44px; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hero h1, .view { animation: none; }
  .proj, .btn { transition: none; } .proj:hover, .btn:hover { transform: none; }
}
</style>
</head>

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === "text") n.textContent = attrs[k];
    else if (k === "class") n.className = attrs[k];
    else n.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return n;
}
function head(id, title, sub) {

}
function link(label, url, cls) { return el("a", { href: url, class: cls || "", target: "_blank", rel: "noopener", text: label }); }

function drawInto(target, list) {
  target.textContent = "";
  list.forEach(function (p) {
    var card = el("article", { class: "proj" + (p.featured ? " featured" : "") });
    card.appendChild(el("div", { class: "top" }, [el("span", { class: "kind", text: p.kind }), p.featured ? el("span", { class: "flag", text: "Featured" }) : null]));

}

/* page views, switched by the address hash */
var VIEWS = ["home", "projects", "experience", "education", "contact"];
function route() {
  var h = (location.hash || "").slice(1);
  if (VIEWS.indexOf(h) < 0) h = "home";
  VIEWS.forEach(function (v) { document.getElementById("view-" + v).hidden = v !== h; });
  Array.prototype.forEach.call(nav.children, function (a) {
    if (a.getAttribute("href") === "#" + h) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route); route();

/* theme toggle (remembered per browser if storage is available) */
var root = document.documentElement;
try { var saved = localStorage.getItem("theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
document.getElementById("theme").addEventListener("click", function () {
  var cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  var next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (e) {}
});

/* bubbles + glitter background */
(function () {
  var c = document.getElementById("fx"); if (!c || !c.getContext) return;
  var x = c.getContext("2d"), W = 0, H = 0;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bubbles = [], stars = [], sparks = [];
  var GLITTER = ["255,217,138", "255,243,196", "255,255,255", "255,159,194", "255,200,225"];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px";
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function mkBubble(init) { return { x: rnd(0, W), y: init ? rnd(0, H) : H + 60, r: rnd(7, 36), vy: rnd(0.18, 0.55), ph: rnd(0, 6.28), sw: rnd(0.2, 0.7) }; }
  function mkStar() { return { x: rnd(0, W), y: rnd(0, H), s: rnd(1.4, 4.2), ph: rnd(0, 6.28), sp: rnd(0.012, 0.04), col: GLITTER[(Math.random() * GLITTER.length) | 0] }; }
  function seed() {
    size();
    bubbles = []; stars = [];
    var nb = Math.max(10, Math.min(26, Math.round(W / 55)));
    var ns = Math.max(30, Math.min(110, Math.round(W / 11)));
    for (var i = 0; i < nb; i++) bubbles.push(mkBubble(true));
    for (var j = 0; j < ns; j++) stars.push(mkStar());
  }
  function star(px, py, s, a, col) {
    x.beginPath();
    for (var i = 0; i < 8; i++) {
      var ang = (Math.PI / 4) * i - Math.PI / 2, rad = i % 2 === 0 ? s : s * 0.22;
      x.lineTo(px + Math.cos(ang) * rad, py + Math.sin(ang) * rad);
    }
    x.closePath(); x.fillStyle = "rgba(" + col + "," + a + ")"; x.fill();
  }
  function drawBubble(b) {
    var g = x.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1, b.x, b.y, b.r);
    g.addColorStop(0, "rgba(255,255,255,0.75)");
    g.addColorStop(0.55, "rgba(255,190,215,0.22)");
    g.addColorStop(1, "rgba(255,140,185,0.18)");
    x.beginPath(); x.arc(b.x, b.y, b.r, 0, 6.2832); x.fillStyle = g; x.fill();
    x.lineWidth = 1; x.strokeStyle = "rgba(255,150,190,0.5)"; x.stroke();
    x.beginPath(); x.arc(b.x - b.r * 0.38, b.y - b.r * 0.38, b.r * 0.2, 0, 6.2832); x.fillStyle = "rgba(255,255,255,0.8)"; x.fill();
  }
  var t = 0;
  function frame() {
    x.clearRect(0, 0, W, H); t += 1;
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i], a = 0.15 + 0.85 * Math.pow(0.5 + 0.5 * Math.sin(s.ph + t * s.sp * 6), 3);
      star(s.x, s.y, s.s, a, s.col);
    }
    for (var j = 0; j < bubbles.length; j++) {
      var b = bubbles[j];
      if (!reduce) { b.y -= b.vy; b.x += Math.sin(b.ph + t * 0.012) * b.sw * 0.5; }
      if (b.y < -60) bubbles[j] = mkBubble(false);
      drawBubble(b);
    }
    for (var k = sparks.length - 1; k >= 0; k--) {
      var p = sparks[k]; p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life -= 0.022;
      if (p.life <= 0) { sparks.splice(k, 1); continue; }
      star(p.x, p.y, p.s, p.life, p.col);
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  seed();
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { seed(); if (reduce) frame(); }, 150); });
  if (reduce) { frame(); return; }
  var last = 0;
  window.addEventListener("pointermove", function (e) {
    var now = Date.now(); if (now - last < 35) return; last = now;
    for (var n = 0; n < 2; n++) sparks.push({ x: e.clientX + rnd(-6, 6), y: e.clientY + rnd(-6, 6), vx: rnd(-0.7, 0.7), vy: rnd(-1, 0.2), s: rnd(2.5, 6), life: 1, col: GLITTER[(Math.random() * GLITTER.length) | 0] });
    if (sparks.length > 80) sparks.splice(0, sparks.length - 80);
  }, { passive: true });
  requestAnimationFrame(frame);
})();
